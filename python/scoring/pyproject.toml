[project]
name = "crosswalk-scoring"
version = "0.1.0"
description = "Heuristic baseline and learned crosswalk priority ranker"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scikit-learn",
  "joblib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
